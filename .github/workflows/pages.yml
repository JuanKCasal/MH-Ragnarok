# Publica la carpeta site/ en GitHub Pages en cada push a main.
# Requisito (una vez): Settings → Pages → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  publicar:
    needs: probar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Copia de site/ con ?v=<commit> en CSS/JS: cada publicación usa URLs nuevas
      # y la web avisa "Hay una versión nueva" (ver scripts/versionar.mjs).
      - name: Versionar
        run: |
          cp -r site _site
          node scripts/versionar.mjs _site "${GITHUB_SHA::7}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
